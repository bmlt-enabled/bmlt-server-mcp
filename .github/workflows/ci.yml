name: ci

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  lint:
    name: lint (pint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-lint-${{ hashFiles('composer.lock') }}

      - name: composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: pint --test
        run: vendor/bin/pint --test

  test:
    name: test (php ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-test-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: copy .env
        run: cp .env.example .env

      - name: app key
        run: php artisan key:generate

      - name: php -l on app/
        run: |
          find app config routes -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: php artisan test
        run: php artisan test
