services:
  mcp:
    build: .
    image: bmlt-server-mcp:local
    ports:
      - "${MCP_PORT:-8080}:8080"
    environment:
      APP_KEY: ${APP_KEY:-base64:dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3Q=}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: file
      BMLT_ROOT_SERVER_URL: ${BMLT_ROOT_SERVER_URL:-https://aggregator.bmltenabled.org/main_server}
      BMLT_ALLOWED_ROOTS: ${BMLT_ALLOWED_ROOTS:-}
      BMLT_ALLOW_ANY_ROOT: ${BMLT_ALLOW_ANY_ROOT:-false}
      BMLT_AGGREGATOR_URL: ${BMLT_AGGREGATOR_URL:-https://aggregator.bmltenabled.org/main_server}
      GEOCODER: ${GEOCODER:-nominatim}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-bmlt-server-mcp/0.1 (set NOMINATIM_USER_AGENT)}
      GOOGLE_GEOCODER_API_KEY: ${GOOGLE_GEOCODER_API_KEY:-}
    restart: unless-stopped
